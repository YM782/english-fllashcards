<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>美式英语 · 发音学习卡片</title>
<style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#18212f;--muted:#687385;--line:#e4e9f0;--blue:#285ed7;--blue2:#eaf0ff;--mint:#e5f6ef;--mintink:#146a4d;--shadow:0 7px 24px rgba(27,46,83,.055)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9ab6ff;outline-offset:2px}.wrap{max-width:1140px;margin:auto;padding:30px 22px 65px}.hero{background:linear-gradient(125deg,#162d61 0%,#2858b8 68%,#3e7ad8 100%);color:white;padding:30px 34px;border-radius:24px;box-shadow:0 12px 30px rgba(32,75,152,.16)}.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:700;opacity:.8}.hero h1{font-size:clamp(25px,4vw,38px);line-height:1.25;margin:9px 0 12px}.hero p{margin:0;color:#e3ecff;font-size:14px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.stat{background:#ffffff1b;border:1px solid #ffffff38;border-radius:12px;padding:10px 16px;min-width:105px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#e0eaff}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:22px 0 13px}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:190px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select{background:white;border:1px solid #dce3ed;border-radius:11px;min-height:44px;padding:9px 12px;color:var(--ink);width:100%}.search{flex:2;min-width:235px}.btn{border:1px solid var(--line);background:white;border-radius:11px;min-height:44px;padding:9px 15px;font-weight:650;color:#30405b}.btn:hover{border-color:#b4c5e6;background:#fafdff}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#1f4fbf}.btn.soft{background:var(--blue2);border-color:#d8e4ff;color:var(--blue)}.actions{display:flex;gap:9px;flex-wrap:wrap}.subbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 17px}.filters{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dce4ee;border-radius:999px;padding:7px 13px;background:white;color:#536174;font-size:13px;font-weight:600}.chip.active{background:#203e7a;color:white;border-color:#203e7a}.note{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:21px 21px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:240px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#c8d5eb}.card-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.word{font-size:23px;letter-spacing:-.02em;font-weight:750;overflow-wrap:anywhere}.ipa{font-size:17px;color:#596477;margin:3px 0 9px;font-family:"Segoe UI",Arial,sans-serif}.meaning{font-size:14px;color:#2d415e;font-weight:600}.category{font-size:11px;color:#526e9d;background:#eff4fc;border-radius:999px;padding:3px 9px;display:inline-block;margin-top:9px}.star{background:transparent;border:0;font-size:25px;line-height:1;color:#a6b0bf;padding:2px 0}.star.on{color:#e6a420}.example{border-top:1px solid #edf0f4;padding-top:12px;margin-top:14px;font-size:13px}.example-en{color:#25344b;font-weight:550}.example-zh{color:#778296;margin-top:3px}.card-actions{display:flex;gap:8px;margin-top:auto;padding-top:15px;flex-wrap:wrap}.play{border:0;border-radius:10px;padding:9px 13px;background:var(--blue);color:white;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.play:hover{background:#174dbb}.play.secondary{background:#eef3fd;color:#2757ac}.play.secondary:hover{background:#e0eaff}.done{margin-left:auto;border:1px solid #dce4ee;background:white;color:#68778c;border-radius:10px;padding:8px 10px;font-size:12px}.done.yes{background:var(--mint);border-color:#c5e8d8;color:var(--mintink)}.delete{border:0;background:transparent;color:#a04a4a;font-size:12px}.panel{margin-top:24px;background:white;border:1px solid var(--line);border-radius:17px;padding:19px 22px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel h2{font-size:17px;margin:0}.panel p{font-size:13px;color:var(--muted);margin:7px 0 0}.custom-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.custom-fields .field{min-width:0}.custom-fields .span3{grid-column:span 3}.foot{font-size:12px;color:#758195;text-align:center;margin-top:20px}.empty{background:white;border:1px dashed #b9c8da;border-radius:15px;padding:36px;text-align:center;color:#718097;grid-column:1/-1}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e2c44;color:white;padding:10px 18px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px #0003;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:14px 13px 38px}.hero{padding:23px 20px;border-radius:19px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:0}.toolbar{margin-top:17px}.field{min-width:calc(50% - 7px)}.search{min-width:100%}.custom-fields{grid-template-columns:1fr}.custom-fields .span3{grid-column:span 1}.actions{width:100%}.actions button{flex:1}.note{font-size:11px}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="eyebrow">AMERICAN ENGLISH · PRONUNCIATION DECK</div>
 <h1>美式英语发音学习卡片</h1>
 <p>把之前学过的单词放在一起：美式 IPA 音标、中文释义、例句、点击朗读。学习进度保存在当前浏览器。</p>
 <div class="stats"><div class="stat"><b id="total">0</b><span>总卡片</span></div><div class="stat"><b id="mastered">0</b><span>已掌握</span></div><div class="stat"><b id="favorites">0</b><span>已收藏</span></div></div>
</header>
<div class="toolbar">
 <div class="field search"><label for="search">搜索单词、中文或例句</label><input id="search" type="search" placeholder="例如：freedom、责任、menu" autocomplete="off" /></div>
 <div class="field"><label for="voice">美式英语发音人</label><select id="voice" aria-label="美式英语发音人"><option value="">自动选择美式英语</option></select></div>
 <div class="field" style="max-width:135px"><label for="rate">播放速度</label><select id="rate"><option value="0.75">0.75× 慢速</option><option value="0.9">0.9×</option><option value="1" selected>1× 正常</option><option value="1.15">1.15×</option></select></div>
 <div class="actions"><button class="btn primary" id="playAll" type="button">▶ 顺序朗读</button><button class="btn" id="shuffle" type="button">⇄ 打乱</button></div>
</div>
<div class="subbar"><div class="filters" id="filters"></div><div class="note" id="count"></div></div>
<main class="grid" id="cards" aria-live="polite"></main>
<section class="panel">
 <div class="panel-head"><div><h2>＋ 添加自己的单词</h2><p>以后学到的新单词，可以直接添加到这套卡片中。</p></div><button class="btn soft" id="toggleAdd" type="button" aria-expanded="false">添加单词</button></div>
 <form id="addForm" style="display:none">
  <div class="custom-fields">
   <div class="field"><label for="newWord">英文单词 *</label><input id="newWord" maxlength="100" required placeholder="freedom" /></div>
   <div class="field"><label for="newIpa">美式 IPA 音标</label><input id="newIpa" maxlength="120" placeholder="/ˈfriːdəm/" /></div>
   <div class="field"><label for="newMeaning">中文释义 *</label><input id="newMeaning" maxlength="160" required placeholder="自由" /></div>
   <div class="field"><label for="newExample">英文例句</label><input id="newExample" maxlength="250" placeholder="Freedom is important." /></div>
   <div class="field"><label for="newTranslation">例句中文</label><input id="newTranslation" maxlength="250" placeholder="自由很重要。" /></div>
   <div class="field" style="justify-content:end"><button class="btn primary" type="submit">保存新卡片</button></div>
  </div>
 </form>
</section>
<p class="foot">播放使用 Chrome / Edge 浏览器的语音合成功能，优先选用美式英语声音。实际音色取决于设备已安装的语音；若没有声音，请检查系统音量及浏览器语音设置。自定义单词和学习进度仅存于本机浏览器。</p>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const seed = [
 {w:'Lola',ipa:'/ˈloʊlə/',zh:'萝拉（人名）',cat:'日常表达',ex:'Hi, Lola! How are you?',tr:'嗨，萝拉！你好吗？'},
 {w:'Geology Rocks!',ipa:'/dʒiˈɑlədʒi rɑks/',zh:'地质学真棒！',cat:'日常表达',ex:'Our science club says, “Geology rocks!”',tr:'我们的科学社团说：“地质学真棒！”'},
 {w:'appreciate',ipa:'/əˈpriʃiˌeɪt/',zh:'感激；欣赏',cat:'日常表达',ex:'I really appreciate your help.',tr:'我非常感谢你的帮助。'},
 {w:'opinion',ipa:'/əˈpɪnjən/',zh:'观点；意见',cat:'社会与法律',ex:'What is your opinion?',tr:'你的看法是什么？'},
 {w:'worried',ipa:'/ˈwɝid/',zh:'担心的；忧虑的',cat:'日常表达',ex:'I am worried about the test.',tr:'我担心这次考试。'},
 {w:'awesome',ipa:'/ˈɔsəm/',zh:'太棒了；极好的',cat:'日常表达',ex:'That is awesome!',tr:'那太棒了！'},
 {w:'exactly',ipa:'/ɪɡˈzæktli/',zh:'正是；完全正确',cat:'日常表达',ex:'Exactly! That is what I mean.',tr:'完全正确！这就是我的意思。'},
 {w:'menu',ipa:'/ˈmɛnju/',zh:'菜单',cat:'餐厅点餐',ex:'Could I see the menu, please?',tr:'请问可以给我看看菜单吗？'},
 {w:'lettuce',ipa:'/ˈlɛtɪs/',zh:'生菜',cat:'餐厅点餐',ex:'No lettuce, please.',tr:'请不要加生菜。'},
 {w:'extra',ipa:'/ˈɛkstrə/',zh:'额外的；另外的',cat:'餐厅点餐',ex:'Can I get extra cheese?',tr:'可以多加一点芝士吗？'},
 {w:'Coke',ipa:'/koʊk/',zh:'可乐',cat:'餐厅点餐',ex:'I would like a Coke, please.',tr:'请给我一杯可乐。'},
 {w:'recommend',ipa:'/ˌrɛkəˈmɛnd/',zh:'推荐；建议',cat:'餐厅点餐',ex:'What do you recommend?',tr:'你推荐什么？'},
 {w:'cheese',ipa:'/tʃiz/',zh:'奶酪；芝士',cat:'餐厅点餐',ex:'Can I have extra cheese?',tr:'可以多加点芝士吗？'},
 {w:'cheeseburger',ipa:'/ˈtʃizˌbɝɡɚ/',zh:'芝士汉堡；奶酪汉堡',cat:'餐厅点餐',ex:'Could I get a cheeseburger and a Coke?',tr:'可以给我一个芝士汉堡和一杯可乐吗？'},
 {w:'popular',ipa:'/ˈpɑpjələr/',zh:'受欢迎的；流行的',cat:'日常表达',ex:'This restaurant is very popular.',tr:'这家餐厅非常受欢迎。'},
 {w:'criticize',ipa:'/ˈkrɪtɪsaɪz/',zh:'批评；批判',cat:'社会与法律',ex:'People have the right to criticize the government.',tr:'人们有权批评政府。'},
 {w:'several',ipa:'/ˈsɛvərəl/',zh:'几个；若干',cat:'日常表达',ex:'I have several questions.',tr:'我有几个问题。'},
 {w:'generally',ipa:'/ˈdʒɛnərəli/',zh:'通常；一般来说',cat:'日常表达',ex:'Generally speaking, I agree with you.',tr:'一般来说，我同意你的看法。'},
 {w:'Constitution',ipa:'/ˌkɑnstəˈtuʃən/',zh:'宪法；章程',cat:'社会与法律',ex:'The Constitution protects our rights.',tr:'宪法保护我们的权利。'},
 {w:'Amendment',ipa:'/əˈmɛndmənt/',zh:'修正案；修订',cat:'社会与法律',ex:'The First Amendment protects freedom of speech.',tr:'第一修正案保护言论自由。'},
 {w:'does',ipa:'/dʌz/',zh:'do 的第三人称单数形式',cat:'日常表达',ex:'Does she speak English?',tr:'她会说英语吗？'},
 {w:'responsibility',ipa:'/rɪˌspɑnsəˈbɪləti/',zh:'责任；职责；义务',cat:'社会与法律',ex:'Freedom comes with responsibility.',tr:'自由伴随着责任。'},
 {w:'ask',ipa:'/æsk/',zh:'问；询问；请求',cat:'日常表达',ex:'Can I ask you something?',tr:'我可以问你一件事吗？'},
 {w:'threats',ipa:'/θrɛts/',zh:'威胁；恐吓（复数）',cat:'社会与法律',ex:'We should take these threats seriously.',tr:'我们应该认真对待这些威胁。'}
];
const KEY='american-pronunciation-deck-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){saved={}}
const state={favorites:saved.favorites||{},mastered:saved.mastered||{},custom:Array.isArray(saved.custom)?saved.custom:[],rate:saved.rate||'1',filter:'全部',search:'',shuffle:false,playingAll:false};
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify({favorites:state.favorites,mastered:state.mastered,custom:state.custom,rate:state.rate}))}catch(_){}}
function all(){return seed.concat(state.custom)}
function idOf(x){return x.customId||x.w.toLowerCase()}
function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function filtered(){let items=all().filter(x=>{let id=idOf(x);let match=state.filter==='全部'||x.cat===state.filter||(state.filter==='收藏'&&state.favorites[id])||(state.filter==='未掌握'&&!state.mastered[id]);let q=state.search.toLowerCase().trim();return match&&(!q||[x.w,x.zh,x.ipa,x.ex,x.tr].join(' ').toLowerCase().includes(q))});if(state.shuffle)items.sort((a,b)=>shuffleRank(idOf(a))-shuffleRank(idOf(b)));return items}
const shuffleMap=new Map();function shuffleRank(id){if(!shuffleMap.has(id))shuffleMap.set(id,Math.random());return shuffleMap.get(id)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function render(){const items=all();$('total').textContent=items.length;$('mastered').textContent=items.filter(x=>state.mastered[idOf(x)]).length;$('favorites').textContent=items.filter(x=>state.favorites[idOf(x)]).length;
 const categories=['全部','餐厅点餐','日常表达','社会与法律','自定义','收藏','未掌握'];$('filters').innerHTML=categories.map(c=>`<button class="chip ${state.filter===c?'active':''}" type="button" data-filter="${esc(c)}">${esc(c)}</button>`).join('');
 const shown=filtered();$('count').textContent=`显示 ${shown.length} / ${items.length} 张卡片`;
 $('cards').innerHTML=shown.length?shown.map(x=>{let id=idOf(x),fav=!!state.favorites[id],done=!!state.mastered[id];return `<article class="card" data-id="${esc(id)}"><div class="card-top"><div><div class="word">${esc(x.w)}</div><div class="ipa">${esc(x.ipa||'（尚未填写音标）')}</div><div class="meaning">${esc(x.zh)}</div><span class="category">${esc(x.cat)}</span></div><button type="button" class="star ${fav?'on':''}" data-action="fav" title="${fav?'取消收藏':'收藏'}" aria-label="${fav?'取消收藏':'收藏'}">${fav?'★':'☆'}</button></div><div class="example"><div class="example-en">${esc(x.ex||'点击播放单词，练习发音。')}</div>${x.tr?`<div class="example-zh">${esc(x.tr)}</div>`:''}</div><div class="card-actions"><button class="play" type="button" data-action="word">▶ 单词发音</button>${x.ex?'<button class="play secondary" type="button" data-action="example">♫ 例句</button>':''}<button type="button" class="done ${done?'yes':''}" data-action="done">${done?'✓ 已掌握':'○ 标记掌握'}</button>${x.customId?'<button class="delete" type="button" data-action="delete">删除</button>':''}</div></article>`}).join(''):'<div class="empty">没有找到匹配的单词。可以清空搜索或切换分类。</div>'}
const synth=window.speechSynthesis;let voices=[];let preferredVoice=null;let speakToken=0;
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));const american=voices.filter(v=>/^en[-_]us$/i.test(v.lang));const other=voices.filter(v=>!/^en[-_]us$/i.test(v.lang));const sorted=[...american,...other];let previous=$('voice').value;$('voice').innerHTML='<option value="">自动选择美式英语</option>'+sorted.map((v,i)=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} · ${esc(v.lang)}</option>`).join('');if(sorted.some(v=>v.voiceURI===previous))$('voice').value=previous;const rank=v=>(/en[-_]us/i.test(v.lang)?100:0)+(/natural|neural|google us|aria|jenny|samantha/i.test(v.name)?25:0)+(v.localService?2:0);preferredVoice=sorted.slice().sort((a,b)=>rank(b)-rank(a))[0]||null}
if(synth){loadVoices();if('onvoiceschanged' in synth)synth.onvoiceschanged=loadVoices;setTimeout(loadVoices,700)}
function stopSpeech(){speakToken++;state.playingAll=false;if(synth)synth.cancel();$('playAll').textContent='▶ 顺序朗读'}
function utter(text,onend){if(!synth){toast('此浏览器不支持语音播放，请用 Chrome 或 Edge 打开。');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(state.rate);u.pitch=1;const chosen=voices.find(v=>v.voiceURI===$('voice').value)||preferredVoice;if(chosen)u.voice=chosen;u.onend=()=>{if(onend)onend()};u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')toast('播放失败，请换一个发音人或检查设备音量。');if(onend)onend()};synth.speak(u)}
function playOne(text){stopSpeech();utter(text)}
function playSequence(){if(state.playingAll){stopSpeech();return}if(!synth){toast('当前浏览器不支持朗读。');return}stopSpeech();let list=filtered();if(!list.length){toast('没有可播放的卡片。');return}state.playingAll=true;$('playAll').textContent='■ 停止朗读';const token=++speakToken;let i=0;const next=()=>{if(token!==speakToken||!state.playingAll)return;if(i>=list.length){state.playingAll=false;$('playAll').textContent='▶ 顺序朗读';toast('本轮朗读完成！');return}utter(list[i++].w,next)};next()}
$('cards').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const card=btn.closest('.card');const x=all().find(x=>idOf(x)===card.dataset.id);if(!x)return;const id=idOf(x);switch(btn.dataset.action){case'word':playOne(x.w);break;case'example':playOne(x.ex);break;case'fav':state.favorites[id]=!state.favorites[id];persist();render();break;case'done':state.mastered[id]=!state.mastered[id];persist();render();break;case'delete':if(confirm(`删除自定义卡片“${x.w}”？`)){state.custom=state.custom.filter(c=>idOf(c)!==id);delete state.favorites[id];delete state.mastered[id];persist();render()}break;}});
$('filters').addEventListener('click',e=>{let b=e.target.closest('button[data-filter]');if(!b)return;state.filter=b.dataset.filter;render()});
$('search').addEventListener('input',e=>{state.search=e.target.value;render()});
$('rate').value=state.rate;$('rate').addEventListener('change',e=>{state.rate=e.target.value;persist()});
$('playAll').addEventListener('click',playSequence);
$('shuffle').addEventListener('click',()=>{state.shuffle=!state.shuffle;shuffleMap.clear();$('shuffle').textContent=state.shuffle?'↩ 恢复顺序':'⇄ 打乱';render()});
$('toggleAdd').addEventListener('click',()=>{let visible=$('addForm').style.display!=='none';$('addForm').style.display=visible?'none':'block';$('toggleAdd').textContent=visible?'添加单词':'收起表单';$('toggleAdd').setAttribute('aria-expanded',String(!visible))});
$('addForm').addEventListener('submit',e=>{e.preventDefault();const w=$('newWord').value.trim(),ipa=$('newIpa').value.trim(),zh=$('newMeaning').value.trim(),ex=$('newExample').value.trim(),tr=$('newTranslation').value.trim();if(!w||!zh)return;state.custom.push({customId:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),w,ipa,zh,cat:'自定义',ex,tr});persist();e.target.reset();state.filter='自定义';state.search='';$('search').value='';render();toast('新卡片已添加，可以点击播放。')});
window.addEventListener('beforeunload',()=>{if(synth)synth.cancel()});
render();
</script>
</body>
</html>
